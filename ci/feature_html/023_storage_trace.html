<!doctype html><html><head>
<!-- options: {"environment":{"RUYIJS_DOM_STORAGE_TRACE":"{DIR}/storage.jsonl"},"expect_files":["storage.jsonl"]} -->
<meta charset="utf-8">
</head><body>
<script>
(() => {
  const R = {name: '023_storage_trace', done: false, cases: []};
  window.__FEATURE_TEST__ = R;
  const add = (name, fn) => {
    try {
      const detail = fn();
      R.cases.push({name, pass: detail === true, detail: detail === true ? "" : detail});
    } catch (e) {
      R.cases.push({name, pass: false, detail: String(e && e.message || e)});
    }
  };
  let request = null;
try { request = indexedDB.open("feature_html_storage"); } catch (e) {}
setTimeout(() => {
  add("indexedDB.open returned a request", () => !!request);
  R.done = true;
  R.pass = R.cases.every(c => c.pass);
}, 20);
  R.done = true;
  R.pass = R.cases.every(c => c.pass);
})();

</script>
</body></html>
