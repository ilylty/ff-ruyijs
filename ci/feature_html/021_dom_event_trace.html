<!doctype html><html><head>
<!-- options: {"environment":{"RUYIJS_DOM_EVENT_TRACE":"{DIR}/event.jsonl"},"expect_files":["event.jsonl"]} -->
<meta charset="utf-8">
</head><body>
<script>
(() => {
  const R = {name: '021_dom_event_trace', done: false, cases: []};
  window.__FEATURE_TEST__ = R;
  const add = (name, fn) => {
    try {
      const detail = fn();
      R.cases.push({name, pass: detail === true, detail: detail === true ? "" : detail});
    } catch (e) {
      R.cases.push({name, pass: false, detail: String(e && e.message || e)});
    }
  };
  let count = 0;
const target = document.createElement("button");
target.addEventListener("click", () => { count += 1; });
target.click();
add("listener ran", () => count === 1);
  R.done = true;
  R.pass = R.cases.every(c => c.pass);
})();

</script>
</body></html>
